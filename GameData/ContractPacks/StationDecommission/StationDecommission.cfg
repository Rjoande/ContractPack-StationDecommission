// Contract Pack: Station Decommission
// An add-on for Contract Pack: Bases and Stations (KerbinSpaceStation).
// Offers a contract to evacuate and deorbit an ageing space station once it has
// been in orbit for at least one Kerbin year. Once the station is gone, the
// "Launch a station" contract of Bases and Stations becomes available again for
// that body.
//
// Requires: Contract Configurator 1.30+ and Contract Pack: Bases and Stations.
// The :NEEDS clause makes this file inert if Bases and Stations is not installed.
//
// All user-facing strings are localized: see Localization/en-us.cfg and it-it.cfg.

CONTRACT_TYPE:NEEDS[ContractPacks/KerbinSpaceStation]
{
	name = StationDecommission
	group = BasesandStations

	title = #LOC_SDC_title
	genericTitle = #LOC_SDC_genericTitle
	description = #LOC_SDC_description
	genericDescription = #LOC_SDC_genericDescription
	synopsis = #LOC_SDC_synopsis
	completedMessage = #LOC_SDC_completedMessage

	// Contract min/max expiry in days, and deadline once accepted.
	minExpiry = 1
	maxExpiry = 10
	deadline = 500
	cancellable = true
	declinable = true
	targetBody = @/targetBody1

	maxSimultaneous = 1

	// Rewards. CrewCapacity() is read from the ProtoVessel, so it works while
	// the station is unloaded (Mass() does not: it returns 0 for unloaded vessels).
	rewardScience = 0
	rewardReputation = Random(1.0, 3.0)
	rewardFunds = 50000.0 + (@/targetVessel1.CrewCapacity() * 5000)
	failureReputation = Random(1.0, 5.0)
	failureFunds = 25000.0
	advanceFunds = 25000.0

	// Pick a habitable station (crew capacity > 0, crewed or not) that is not
	// landed and has a mission elapsed time of at least one Kerbin year (426d).
	// GROUP_ACTIVE prevents targeting a station that already has another active
	// Bases and Stations contract (crew rotation, evacuation, ...).
	DATA
	{
		type = Vessel
		uniquenessCheck = GROUP_ACTIVE
		requiredValue = true
		targetVessel1 = AllVessels().Where(v => v.VesselType() == Station && v.CrewCapacity() > 0 && v.IsOrbiting() && v.MET() > 426d).SelectUnique()
		title = #LOC_SDC_data_station
	}

	DATA
	{
		type = CelestialBody
		requiredValue = true
		targetBody1 = @/targetVessel1.CelestialBody()
		hidden = true
	}

	// Step 1: evacuate the station.
	// Note: HasCrew with maxCrew = 0 counts crew members only; tourists are ignored
	// (Contract Configurator behaviour, shared with the Evacuate contract).
	PARAMETER
	{
		name = Evacuation
		type = VesselParameterGroup
		title = #LOC_SDC_param_evacuation
		vessel = @/targetVessel1

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = #LOC_SDC_param_hasCrew
		}
	}

	// Step 2: destroy the station. VesselDestroyed must live inside a
	// VesselParameterGroup bound to the station; outside a group a vessel
	// parameter applies to the active vessel (or to any vessel when there is no
	// active vessel), which would let any crash complete the contract.
	PARAMETER
	{
		name = Deorbit
		type = VesselParameterGroup
		title = #LOC_SDC_param_deorbit
		vessel = @/targetVessel1
		completeInSequence = true

		PARAMETER
		{
			name = DestroyStation
			type = VesselDestroyed
			title = #LOC_SDC_param_destroyed
		}
	}

	REQUIREMENT
	{
		name = RandomRoll
		type = Expression
		checkOnActiveContract = false
		expression = @BasesandStations:randomRoll > 5
		title = #LOC_SDC_req_rng
	}
}
